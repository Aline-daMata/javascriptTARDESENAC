
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação -->
    <title>Exercício extra 03</title> <!-- Título da página -->
</head>
<body>
    <h1>Exercício extra 03</h1> <!-- Título principal -->
 
    <p id="resultado">Valor final da variável a:</p> <!-- Parágrafo do resultado -->
 
    <script>
        var a = 6; // Cria a variável a com valor 6
        a++; // Incrementa a variável em 1
 
        document.getElementById("resultado").innerHTML += a; // Mostra o resultado
    </script>
</body>
</html>
 
 
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação -->
    <title>Exercício extra 04</title> <!-- Título da página -->
</head>
<body>
    <h1>Exercício extra 04</h1> <!-- Título principal -->
 
    <p id="resultado1">Valor final da variável a: </p> <!-- Resultado de a -->
    <p id="resultado2">Valor final da variável b: </p> <!-- Resultado de b -->
    <p id="resultado3">As variáveis são iguais: </p> <!-- Comparação -->
 
    <script>
        var a = 6; // Cria a variável a
        var b = 6; // Cria a variável b
 
        document.getElementById("resultado1").innerHTML += a; // Mostra a
        document.getElementById("resultado2").innerHTML += b; // Mostra b
        document.getElementById("resultado3").innerHTML += (a === b); // Compara a e b
    </script>
</body>
</html>

## Explicação do exercício 04
 
Neste exercício, criamos duas variáveis chamadas `a` e `b`, ambas com o valor 6. Depois mostramos os valores na página HTML e usamos o operador `===` para comparar se as duas variáveis são iguais. Como os valores são iguais, o resultado será `true`.
 
Resumo para falar ao professor:
 
- Exercício 03: adicionamos 1 ao valor da variável.
