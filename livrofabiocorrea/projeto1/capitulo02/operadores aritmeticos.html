<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operadores aritmeticos</title>
</head>
<body>
    <h1>operadores aritmeticos</h1>

    <script>
        //numero +numero = adicao
        var resposta = 1 + 2;


        //booleano + booleano = adicao
        resposta = true +1;
        document.write(resposta + '<br>')

        //booleano + booleano = adicao
        var resposta1 = false + false;
        var resposta2 = false + true;
        var resposta3 = true + true ;

        document.write(resposta1 + "<br>");
        document.write(resposta2 + "<br>");
        document.write(resposta3 + "<br>");

        //numero +string = concatenacao
        resposta = 5 + 'senac'
        document.write(resposta + '<br>');

        // string + boolean = concatenacao
        resposta = 'senac'+ false;
        document.write(resposta + '<br');

        //string + string = concatenacao
        resposta = 'senac'+ 'javaScript';
        document.write(resposta + '<br>');
    </script>
    
</body>
</html>


<!-- Operadores Aritméticos em JavaScript



 vou falar sobre operadores aritméticos em JavaScript.

Primeiro, temos a adição de números. Por exemplo, 1 mais 2 é igual a 3.

Depois, temos os valores booleanos. Em JavaScript, true vale 1 e false vale 0.

Quando somamos true com false, o resultado é 1. Quando somamos true com true, o resultado é 2.

Também podemos juntar números com textos. Por exemplo, 5 com a palavra Senac resulta em 5Senac.

Quando juntamos textos com valores booleanos, também acontece uma concatenação.

Por exemplo, Senac com false resulta em Senacfalse.

E quando juntamos duas palavras, como Senac e JavaScript, o resultado é SenacJavaScript.

Para finalizar, o operador + pode ser usado para somar números ou juntar textos. -->
