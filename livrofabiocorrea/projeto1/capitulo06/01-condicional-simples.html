<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional Simples</title>
</head>

<body>

    <h1>Estrutura Condicional Simples</h1>
    <p id="teste"></p>

    <script>
        //Criando a variável 

        media = 7;

        // Criando o condicional simples

        if (media >= 7) {

            resposta = 'Aprovado(a)!';

        }

        // Mostrando o resultado
        document.getElementById('teste').innerHTML = resposta;

    </script>

</body>

</html>
