<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional Composta</title>
</head>

<body>

    <h1>Estrutura Condicional Composta</h1>
    <p id="teste"></p>

    <script>

        // Criando a variável

        media = 6;


        // Criando o condicional composta

        if (media >= 7) {

            resposta = 'Aprovado(a)!';

        } else {

            resposta = 'Reprovado(a)!';

        }


        // Mostrando o resultado

        document.getElementById('teste').innerHTML = resposta;



    </script>

</body>

</html>
