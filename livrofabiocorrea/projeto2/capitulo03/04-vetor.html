<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor Exemplo</title>
</head>

<body>
    <h1>EXEMPLO DE VETOR</h1>
    <h3>Unindo Conteúdo</h3>
    <p id="teste"></p>

    <script>

        // Criando os vetores

        var vetor1 = [1, 2, 3];

        var vetor2 = [4, 5, 6];

        var vetor3 = [7, 8, 9];

        var resultado = vetor1.concat(vetor2, vetor3);


        document.getElementById('teste').innerHTML = resultado;


    </script>

</body>

</html>
