<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor Exemplo</title>
</head>

<body>
    <h1>EXEMPLO DE LISTA DE VETOR</h1>
    <h3>Adiciona um ou mais elementos</h3>
    <p id="teste1">Com unshift: </p>
    <p id="teste2">Sem unshift: </p>

    <script>

        var vetor = [2, 3, 4, 5];

        // Mostrando o vetor no Id chamado ‘teste1’
        document.getElementById('teste1').innerHTML += vetor;


        // Adicionando elementos no início do vetor

        vetor.unshift(0, 1);

        // Mostrando novamente o vetor, agora com os elementos adicionados no início.

        document.getElementById('teste2').innerHTML += vetor;


    </script>

</body>

</html>
