<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício extra 06</title>

</head>

<body>

    <h1>Exercício extra 06</h1>

    <p id="resultado">Números: </p>


    <script>

        let vetor1 = [1, 2, 3, 4, 5];


        let vetor2 = [6, 7, 8, 9, 10];


        let todosNumeros = vetor1.concat(vetor2);


        let paragrafo = document.getElementById("resultado");


        paragrafo.innerHTML += todosNumeros.join(", ");

    </script>

</body>

</html>
