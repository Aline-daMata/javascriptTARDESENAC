<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço FOR</title>
</head>

<body>
    <h1>Laço de Repetição WHILE</h1>
    <p id="tabuada"></p>

    <script>

        // Criando as variáveis

        var num = 5;
        var cont = 1;

        var resposta = '';

        // Criando a tabuada

        while (cont <= 10) {

            resposta += num + ' X ' + cont + ' = ' + (num * cont) + '<br>';

            cont++;

        }


        // Mostrando a tabuada

        document.getElementById('tabuada').innerHTML = resposta;



    </script>

</body>

</html>
