<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício extra </title>
</head>
<body>
    <h1>Exercício extra </h1>
    <p id="resultado"></p>

    <script>
        let total = 1;
        let cont = 1;
        let paragrafo = document.getElementById("resultado");

        for (cont = 1; cont <= 10; cont++) {
            total += 2;
            paragrafo.innerHTML += total + " ";
        }
    </script>
</body>
</html>
