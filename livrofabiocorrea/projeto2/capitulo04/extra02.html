<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício extra</title>
</head>
<body>
    <h1>Exercício extra </h1>
    <p id="resultado"></p>

    <script>
        let total = 10;
        let cont = 10;
        let paragrafo = document.getElementById("resultado");

        while (cont >= 1) {
            total = cont;
            paragrafo.innerHTML += total + " ";
            cont--;
        }
    </script>
</body>
</html>
