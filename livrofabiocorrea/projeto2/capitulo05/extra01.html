<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício extra </title>
</head>

<body>
    <h1>Exercício extra </h1>
    <p id="resultado">Soma dos números multiplicados por 2: </p>

    <script>
        let somaTotal = 0;
        let paragrafo = document.getElementById("resultado");

        for (let i = 1; i <= 5; i++) {
            let numeroDigitado = Number(prompt("Digite o " + i + "º número:"));
            let multiplicado = numeroDigitado * 2;
            somaTotal += multiplicado;
        }

        paragrafo.innerHTML += somaTotal;
    </script>
</body>

</html>
