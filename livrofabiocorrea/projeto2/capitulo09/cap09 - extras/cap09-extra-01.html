<body>

    <p id="resultado"></p>
    <script>
        var computador = {
            processador: 'Intel core i7',
            memoria: '16 GB',
            ssd: '500 gb',
            motherboard: 'Asus TUF GAMMING B550M',
            fonte: '600 W',
            pcCompleto: function(){
                return 'Processador: ' + this.processador + '<br>' +

        document.write (computador.pcCompleto()); //chama a funçao dentro do objeto
    </script>
