<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DOM - setInterval() e clearInterval()</title>
    <style>
        #quadrado {
            width: 400px;
            height: 400px;
            position: relative;
            background-color: #dddddd;
        }
        #bola {
            width: 50px;
            height: 50px;
            position: absolute;
            background-color: #e63946;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <h1>DOM - Animação</h1>
    <p><button onclick="Anima()">Animar</button></p>

    <div id="quadrado">
        <div id="bola"></div>
    </div>

    <script>
        // Declarando a função
        function Anima() {
            var elemento = document.getElementById('bola');
            var posicao = 0;
            var id = setInterval(Local, 5);

            // Declarando a função Local
            function Local() {
                if (posicao == 350) {
                    clearInterval(id);
                }
                else {
                    posicao++;
                    elemento.style.top = posicao + 'px';
                    elemento.style.left = posicao + 'px';
                }
            }
        }
    </script>
</body>
</html>
